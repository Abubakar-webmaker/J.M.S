<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobManager</title>
    <script>
      // Apply the stored theme before first paint to prevent a flash of the
      // wrong theme (FOUC). Kept inline + dependency-free on purpose.
      (function () {
        try {
          var stored = localStorage.getItem('jobmanager-theme-v2');

          // One-time migration from the legacy v1 key (which may be 'system').
          if (stored !== 'light' && stored !== 'dark') {
            var legacy = localStorage.getItem('jobmanager-theme-v1');
            if (legacy === 'light' || legacy === 'dark') {
              stored = legacy;
            } else if (legacy === 'system') {
              stored = window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
            } else {
              stored = 'light';
            }
          }

          var resolved = stored === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', resolved === 'dark');
          root.style.colorScheme = resolved;
        } catch (e) {
          /* localStorage unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
